<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Subject Resources | uniCLOUD</title>

  <!-- Meta Tags for Social Sharing -->
  <meta property="og:title" content="uniCLOUD">
  <meta property="og:description" content="YOUR ENTIRE CAMPUS. ONE PLATFORM.">
  <meta property="og:image" content="https://uni-cloud-nine.vercel.app/og-image.png">
  <meta property="og:url" content="https://uni-cloud-nine.vercel.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="uniCLOUD">
  <meta name="twitter:description" content="YOUR ENTIRE CAMPUS. ONE PLATFORM.">
  <meta name="twitter:image" content="https://uni-cloud-nine.vercel.app/og-image.png">
  <link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/phosphor-icons@1.4.2/src/css/icons.css" rel="stylesheet">

<style>
  *{box-sizing:border-box}
  html,body{min-height:100vh;margin:0;padding-bottom:40px;font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background: linear-gradient(145deg, rgba(76, 29, 149, 0.1) 0%, transparent 50%), radial-gradient(circle at top left, rgba(76, 29, 149, 0.15) 0%, transparent 50%);
    background-color: #000;
    color:#fff;background-attachment:fixed;}
  body::after{content:"";position:fixed;inset:0;background-image:url("https://www.transparenttextures.com/patterns/asfalt-light.png");opacity:0.05;pointer-events:none}

  /* header */
  .header{padding:28px 80px}
  .header h1{font-size:40px;margin:0 0 6px 0;text-shadow:0 0 8px rgba(170,140,255,0.45),0 0 25px rgba(120,90,220,0.25)}
  .header p{margin:0;color:#aaa;font-size:13px;letter-spacing:1px}

  /* panel */
  .subject-panel{
    width:min(1100px,92%);
    margin:30px auto;
    background:rgba(15,15,20,0.9);
    border-radius:18px;
    padding:22px;
    border:1px solid rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    box-shadow:0 40px 80px rgba(0,0,0,0.7), inset 0 0 25px rgba(255,255,255,0.02);
  }

  /* top row: tabs centered, preview box on right */
  .top-row{
    display:flex;
    align-items:flex-start;
    gap:20px;
  }
  .left {
    flex:1;
    display:flex;
    justify-content:center; /* center the tab group */
  }
  .right {
    width:340px; /* preview box width */
    max-width:40%;
  }

  /* tabs group centered */
  .subject-tabs{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }

  .tab {
    padding:10px 18px;
    border-radius:999px;
    background:rgba(255,255,255,0.04);
    color:#cfcfcf;
    border:1px solid transparent;
    cursor:pointer;
    font-size:14px;
    transition:all .18s ease;
  }
  .tab:hover{color:#fff; transform:translateY(-2px)}
  .tab.active{
    background:linear-gradient(90deg, rgba(160,120,255,0.24), rgba(120,90,220,0.12));
    color:#fff;
    box-shadow:inset 0 0 18px rgba(160,120,255,0.28);
    border:1px solid rgba(160,120,255,0.12);
  }

  /* preview box (right) */
  .preview {
    background: rgba(10,10,14,0.7);
    border-radius:12px;
    padding:14px;
    border:1px solid rgba(255,255,255,0.04);
    min-height:54px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .preview .emoji{font-size:20px}
  .preview .text{background:rgba(255,255,255,0.02);padding:12px;border-radius:10px;flex:1}
  .preview .text p{margin:0;color:#e6e6e6;font-size:14px}

  /* semester heading & file list below */
  .subject-panel h2{margin:20px 0 12px 0;font-size:22px}
  #fileList{margin-top:8px}

  .file-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:rgba(255,255,255,0.03);
    padding:12px 14px;
    border-radius:12px;
    margin-bottom:12px;
    border:1px solid rgba(255,255,255,0.03);
  }
  .file-row span{font-size:15px;color:#f2f2f2}
  .file-actions{
    display:flex;
    gap:8px;
  }
  .pill-btn{
    border:0;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    font-size:12px;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .download-btn{
    background:linear-gradient(90deg, rgba(160,120,255,0.32), rgba(140,100,220,0.28));
    color:#fff;
  }
  .download-btn:hover{transform:translateY(-2px);background:linear-gradient(90deg, rgba(160,120,255,0.45), rgba(140,100,220,0.38))}
  .save-btn{
    background:rgba(15,15,20,0.8);
    color:#e5e5ff;
    border:1px solid rgba(192,132,252,0.4);
  }
  .save-btn.saved{
    background:rgba(34,197,94,0.15);
    border-color:rgba(34,197,94,0.6);
    color:#bbf7d0;
  }

  @media (max-width:880px){
    .right{display:none}
    .top-row{flex-direction:column;align-items:center}
    .subject-panel{padding:16px; width:94%; border-radius:18px;}
    .header{padding:20px 16px}
    .header h1{font-size:clamp(1.8rem,7vw,2.4rem)}
    .header div[style*="display:flex"] { flex-direction:column; align-items:flex-start !important; gap:16px; }
    #setDefaultBtn { width: auto; padding: 10px 20px; color: #fff; font-weight: 500; }
  }

  @media (max-width:768px){
    .header{padding:16px 20px 0}
    .left { width: 100%; overflow: hidden; }
    .subject-panel{
      width:calc(100% - 24px); 
      margin:16px auto 30px; 
      border-radius:20px; 
      background:rgba(20,20,25,0.7);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 20px 16px;
    }
    .tab{padding:12px 18px;font-size:13px;min-height:44px;white-space:nowrap;background:rgba(255,255,255,0.06);}
    .file-row{
      flex-direction:column;
      align-items:flex-start;
      gap:14px;
      padding: 16px;
      background:rgba(255,255,255,0.04);
      border-radius:14px;
    }
    .file-row span { font-size: 14px; line-height: 1.4; }
    .file-actions{width:100%;flex-wrap:nowrap; gap:10px;}
    .pill-btn{min-height:44px;padding:12px 16px;flex:1;text-align:center;font-size:13px;font-weight:600;}
    .subject-tabs{
      justify-content:flex-start;
      width:100%;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      flex-wrap:nowrap;
      padding-bottom:8px;
      gap:8px;
    }
    .subject-tabs::-webkit-scrollbar { display: none; }
  }

  @media (max-width:380px){
    .file-actions{flex-wrap:wrap;}
    .pill-btn{flex:1 1 100%}
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(34, 197, 94, 0.9);
    color: #fff;
    padding: 12px 24px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(8px);
  }
  .toast.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast i { font-size: 18px; }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      color: transparent !important;
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .skeleton * {
      visibility: hidden;
    }

    /* Video Roadmap & Unit Cards UI */
    .video-roadmap-container {
      display: flex;
      flex-direction: column;
      gap: 36px;
      padding: 10px 0 40px 0;
    }
    .roadmap-header-box {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 5px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }
    .roadmap-header-box h3 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .roadmap-header-box p {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      margin: 0;
      line-height: 1.5;
    }
    .unit-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .unit-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .unit-title {
      font-size: 19px;
      font-weight: 700;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid #a855f7;
      padding-left: 12px;
      margin: 0;
    }
    .unit-time {
      font-size: 12px;
      background: rgba(168, 85, 247, 0.2);
      color: #d8b4fe;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .video-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 20px;
    }
    .video-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .video-card:hover {
      transform: translateY(-4px);
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      background: rgba(255, 255, 255, 0.05);
    }
    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      align-self: flex-start;
    }
    .badge-primary { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-secondary { background: rgba(236, 72, 153, 0.2); color: #f48fb1; border: 1px solid rgba(236, 72, 153, 0.3); }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 8px 0;
      line-height: 1.4;
    }
    .card-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.5;
      margin: 0 0 16px 0;
      flex-grow: 1;
    }
    .video-links-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      flex-grow: 1;
    }
    .video-link-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: #e2e8f0;
      text-decoration: none;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      border: 1px solid transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .video-link-item:hover {
      background: rgba(168, 85, 247, 0.15);
      color: #fff;
      border-color: rgba(168, 85, 247, 0.3);
    }
    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .card-btn:hover {
      opacity: 0.92;
    }
    .unit-note-box {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-left: 4px solid #f59e0b;
      padding: 14px 18px;
      border-radius: 8px;
      color: #fde68a;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .unit-note-box.info {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-left: 4px solid #6366f1;
      color: #e0e7ff;
    }
    .unit-divider {
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
      margin: 4px 0;
    }
    .summary-table-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }
    .summary-table-box h4 {
      margin: 0;
      padding: 16px 20px;
      font-size: 16px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }
    .summary-table-box table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }
    .summary-table-box th {
      background: rgba(255, 255, 255, 0.05);
      color: #a855f7;
      padding: 12px 20px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .summary-table-box td {
      padding: 12px 20px;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.5;
    }
    .summary-table-box tr:last-child td {
      border-bottom: none;
    }
    .summary-table-box a {
      color: #38bdf8;
      text-decoration: none;
    }
    .summary-table-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header">
    <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>
            <h1 id="subjectTitle">Subject</h1>
            <p id="branchTitle">Branch</p>
        </div>
        <button id="setDefaultBtn" class="pill-btn" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); font-size:13px; color:#fff;">
            <i class="ph ph-check" style="display:none; margin-right:4px;"></i> Set as Default
        </button>
    </div>
  </div>

  <div class="toast" id="toast">
    <i class="ph ph-check-circle"></i>
    <span>Default course updated</span>
  </div>

  <div class="subject-panel">

    <div class="top-row">
      <!-- left: centered tabs -->
      <div class="left">
        <div class="subject-tabs" role="tablist" aria-label="Subject tabs">
          <button class="tab" data-type="syllabus" aria-selected="true">Syllabus</button>
          <button class="tab" data-type="notes">Notes</button>
          <button class="tab" data-type="labs">Labs</button>
          <button class="tab" data-type="tutorial">Tutorials</button>
          <button class="tab" data-type="pyqs">PYQs</button>
          <button class="tab" id="videoTabBtn" data-type="videos">Videos</button>
        </div>
      </div>

      <!-- right: preview box -->
      <div class="right">
        <div class="preview" id="previewBox">
          <div class="text"><p id="previewText">Syllabus content goes here</p></div>
        </div>
      </div>
    </div>

    <h2 id="semesterHeading">Semester 1 – <span id="subjectSmall">Subject</span></h2>

    <div id="fileList" aria-live="polite">
      <!-- Initial Skeletons -->
      <div class="file-row skeleton" style="height:76px; margin-bottom:14px; background:rgba(255,255,255,0.04);"></div>
      <div class="file-row skeleton" style="height:76px; margin-bottom:14px; background:rgba(255,255,255,0.04);"></div>
      <div class="file-row skeleton" style="height:76px; margin-bottom:14px; background:rgba(255,255,255,0.04);"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
<script>
  /* read URL params */
  const params = new URLSearchParams(window.location.search);
  const subject = params.get('subject') || 'Mathematics I';
  const branch  = params.get('branch')  || 'Petroleum';
  const semester = params.get('semester') ? parseInt(params.get('semester'), 10) : 1;

  document.getElementById('subjectTitle').innerText = subject;
  document.getElementById('branchTitle').innerText  = branch;
  document.getElementById('subjectSmall').innerText  = subject;
  const semHeading = document.getElementById('semesterHeading');
  if (semHeading) semHeading.innerHTML = 'Semester ' + semester + ' – <span id="subjectSmall">' + subject + '</span>';

  if (window.unicloud && branch && semester >= 1) {
    window.unicloud.patch('/api/users/me', { default_branch: branch, default_semester: semester }).catch(function () {});
  }

  /* file data - fetched from API */
  let fileData = {
    syllabus: [],
    notes: [],
    labs: [],
    tutorial: [],
    pyqs: [],
    videos: []
  };

  function fetchResources() {
      if (!window.unicloud) return Promise.resolve();
      return window.unicloud.get('/api/subject-resources?branch=' + encodeURIComponent(branch) + '&subject=' + encodeURIComponent(subject) + '&sem=' + encodeURIComponent(semester))
          .then(data => {
              if (data) {
                  fileData.syllabus = data.syllabus || [];
                  fileData.labs = data.lab || []; // map lab -> labs
                  fileData.pyqs = data.pyq || []; // map pyq -> pyqs
                  fileData.notes = data.notes || [];
                  fileData.tutorial = data.tutorial || [];
                  fileData.videos = (data.video || []).concat(data.videos || []);
              }
          })
          .catch(err => console.error('Failed to fetch resources', err));
  }

  /* preview text per tab (simple) */
  const previewText = {
    syllabus: "Syllabus content goes here",
    notes: "Notes for this subject will appear here. Click a file to preview/download.",
    labs: "Lab manuals and experiments are listed below.",
    tutorial: "Tutorial sheets and problem sets for practice.",
    pyqs: "Previous year question papers for practice.",
    videos: "Video lectures and tutorials for in-depth conceptual learning."
  };

  /* DOM refs */
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const previewEl = document.getElementById('previewText');
  const fileList = document.getElementById('fileList');

  let savedResources = [];

  function fetchSaved() {
    if (!window.unicloud) return Promise.resolve([]);
    return window.unicloud.get('/api/saved').then(list => {
        savedResources = Array.isArray(list) ? list : [];
        return savedResources;
    }).catch(() => {
        savedResources = [];
        return [];
    });
  }

  /* render files for a type */
  function loadFiles(type){
    // toggle active tab
    tabs.forEach(t => {
      if(t.dataset.type === type){
        t.classList.add('active');
        t.setAttribute('aria-selected','true');
      } else {
        t.classList.remove('active');
        t.setAttribute('aria-selected','false');
      }
    });

    // update preview
previewEl.textContent = previewText[type] || "";

    // render file rows
    fileList.innerHTML = "";

    if (type === 'videos') {
        const sName = subject.trim().toLowerCase();
        if (sName === 'aem i' || sName === 'aem 1' || sName === 'mathematics i' || sName.includes('aem i')) {
            renderAEMVideoRoadmap(fileList);
            return;
        }
        if (sName === 'aem ii' || sName === 'aem 2' || sName === 'mathematics ii' || sName.includes('aem ii') || sName.includes('aem 2')) {
            renderAEM2VideoRoadmap(fileList);
            return;
        }
        if (sName.includes('programming') || sName === 'c language' || sName === 'c programming' || sName === 'c' || sName.includes('problem solving')) {
            renderCVideoRoadmap(fileList);
            return;
        }
    }

    if (branch !== 'CSE' && type !== 'pyqs') {
      const comingSoon = document.createElement('div');
      comingSoon.style.padding = "60px 20px";
      comingSoon.style.textAlign = "center";
      comingSoon.style.color = "rgba(255,255,255,0.7)";
      comingSoon.style.fontSize = "24px";
      comingSoon.style.fontWeight = "600";
      comingSoon.style.letterSpacing = "2px";
      comingSoon.style.background = "linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent)";
      comingSoon.style.borderRadius = "12px";
      comingSoon.innerHTML = 'COMING SOON';
      fileList.appendChild(comingSoon);
      return;
    }

    const arr = fileData[type] || [];
    if(arr.length === 0){
      const no = document.createElement('div');
      no.className = 'file-row';
      no.innerHTML = `<span>No files uploaded yet</span><span></span>`;
      fileList.appendChild(no);
      return;
    }

    arr.forEach((f, index) => {
      const r = document.createElement('div');
      r.className = 'file-row';
      r.innerHTML = `
        <span>${f.name}</span>
        <div class="file-actions">
          <a href="${f.link}" target="_blank" rel="noopener noreferrer">
            <button class="pill-btn download-btn">${type === 'videos' ? '<i class="ph ph-play-circle" style="vertical-align:middle;margin-right:3px;"></i>Watch' : 'Download'}</button>
          </a>
          <button class="pill-btn save-btn">Save</button>
        </div>`;
      
      const saveBtn = r.querySelector('.save-btn');
      
      // Check if saved
      const savedItem = savedResources.find(s => s.name === f.name && s.link === f.link && s.subject === subject && s.branch === branch);
      if (savedItem) {
        saveBtn.classList.add('saved');
        saveBtn.textContent = "Saved";
      }

      saveBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        if (!window.unicloud) {
            alert("Please sign in to save resources.");
            return;
        }

        const isSaved = saveBtn.classList.contains('saved');
        
        if (isSaved) {
             // Find ID to delete
             const item = savedResources.find(s => s.name === f.name && s.link === f.link);
             if (item) {
                 window.unicloud.del('/api/saved/' + item.id).then(() => {
                     saveBtn.classList.remove('saved');
                     saveBtn.textContent = "Save";
                     // update local list
                     savedResources = savedResources.filter(s => s.id !== item.id);
                 }).catch(err => console.error(err));
             }
        } else {
             // Save
             const payload = {
                 branch: branch,
                 subject: subject,
                 resource_type: type,
                 name: f.name,
                 link: f.link
             };
             window.unicloud.post('/api/saved', payload).then(newItem => {
                 saveBtn.classList.add('saved');
                 saveBtn.textContent = "Saved";
                 savedResources.push(newItem);
             }).catch(err => {
                 console.error(err);
                 if (err.status === 401) alert("Please sign in to save.");
             });
        }
      });

      fileList.appendChild(r);
    });
  }

  /* tab handlers */
  tabs.forEach(t => {
    t.addEventListener('click', (e)=>{
      const type = t.dataset.type;
      loadFiles(type);
    });
  });

  /* default on load */
  document.addEventListener('DOMContentLoaded', () => {
    // Instantly set the active tab UI to feel faster
    const defaultTabType = (branch === 'CSE') ? 'syllabus' : 'pyqs';
    tabs.forEach(t => {
      if(t.dataset.type === defaultTabType){
        t.classList.add('active');
        t.setAttribute('aria-selected','true');
      } else {
        t.classList.remove('active');
        t.setAttribute('aria-selected','false');
      }
    });

    Promise.all([fetchSaved(), fetchResources()]).then(() => {
        loadFiles(defaultTabType);
    });

    // "Set as Default" button logic
    const setDefaultBtn = document.getElementById('setDefaultBtn');
    const toast = document.getElementById('toast');
    
    if (setDefaultBtn) {
        setDefaultBtn.addEventListener('click', () => {
            if (!window.unicloud) {
                alert("Please sign in to set default course.");
                return;
            }
            
            // Show loading state (optional)
            const originalText = setDefaultBtn.innerHTML;
            setDefaultBtn.textContent = "Setting...";
            
            window.unicloud.patch('/api/users/me', { 
                default_branch: branch, 
                default_semester: semester 
            })
            .then(updatedUser => {
                // Restore button
                setDefaultBtn.innerHTML = `<i class="ph ph-check" style="margin-right:4px;"></i> Default Set`;
                setDefaultBtn.classList.add('saved'); // Optional styling if you want to keep it green
                
                // Show toast
                if (toast) {
                    toast.classList.add('visible');
                    setTimeout(() => {
                        toast.classList.remove('visible');
                    }, 3000);
                }
            })
            .catch(err => {
                console.error(err);
                setDefaultBtn.innerHTML = originalText;
                alert("Failed to set default course.");
            });
        });
    }
  });
